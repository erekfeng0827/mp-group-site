<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space — 浩瀚無垠的真空 | Aether Vibes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/group/group-bar.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body,html{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Noto Serif TC',serif}
  .bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.45;z-index:1;transition:opacity 2s ease;background:#000}
  .bg.playing{opacity:.85}
  .content{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E8DCC8;text-align:center;padding:20px}
  h1{font-family:'Cormorant',serif;font-size:clamp(36px,8vw,72px);font-weight:300;letter-spacing:.12em;font-style:italic;margin-bottom:8px}
  .subtitle{font-size:15px;letter-spacing:.1em;font-weight:300;opacity:.75}
  .player-ui{margin-top:50px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .controls{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.08);padding:14px 28px;border-radius:50px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18)}
  .ctrl-btn{background:none;border:none;color:#E8DCC8;cursor:pointer;font-size:18px;padding:0;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.4);transition:all .3s}
  .ctrl-btn:hover{background:#E8DCC8;color:#000}
  .ctrl-btn.main{width:52px;height:52px;font-size:24px;border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.1)}
  .track-info{font-family:'Cormorant',serif;font-size:15px;letter-spacing:.08em;opacity:.85;max-width:450px;min-height:22px}
  .track-counter{font-family:'Cormorant',serif;font-size:11px;letter-spacing:.15em;opacity:.5;text-transform:uppercase}
  .progress-bar{width:280px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:rgba(232,220,200,.7);width:0%;transition:width .3s}
  .back-btn{position:absolute;top:40px;left:40px;color:#E8DCC8;text-decoration:none;font-family:'Cormorant',serif;font-size:18px;letter-spacing:.1em;z-index:20;transition:opacity .3s}
  .back-btn:hover{opacity:.6}
  .playlist-toggle{position:absolute;bottom:30px;right:30px;color:#E8DCC8;font-family:'Cormorant',serif;font-size:13px;letter-spacing:.1em;cursor:pointer;opacity:.6;z-index:20;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);padding:8px 16px;border-radius:20px;backdrop-filter:blur(8px);transition:all .3s}
  .playlist-toggle:hover{opacity:1;background:rgba(255,255,255,.15)}
  .playlist-panel{position:absolute;bottom:75px;right:30px;width:340px;max-height:55vh;background:rgba(10,8,7,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:12px;overflow-y:auto;z-index:20;display:none;padding:16px 0}
  .playlist-panel.open{display:block}
  .playlist-panel li{list-style:none;padding:10px 20px;font-family:'Cormorant',serif;font-size:13.5px;color:rgba(232,220,200,.65);cursor:pointer;letter-spacing:.05em;transition:all .2s;border-bottom:1px solid rgba(255,255,255,.03)}
  .playlist-panel li:hover{background:rgba(255,255,255,.08);color:#E8DCC8}
  .playlist-panel li.active{color:#E8DCC8;border-left:3px solid #B5673A;background:rgba(181,103,58,.15)}
</style>
</head>
<body>
<a href="index.html" class="back-btn">← Back</a>
<video class="bg" id="bgLayer" autoplay muted loop playsinline disablepictureinpicture preload="auto" poster="img/space.jpg"><source src="img/Video/space_h264.mp4" type="video/mp4"><source src="img/Video/space.mp4" type='video/mp4; codecs="hvc1"'></video>
<div class="content">
  <h1>Infinite Void</h1>
  <p class="subtitle">抽離一切繁雜，進入完全無重力的心靈深淵</p>
  <div class="player-ui">
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
      <button class="ctrl-btn main" id="playBtn" title="播放 / 暫停">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
    </div>
    <div class="track-info" id="trackInfo">點擊播放開始沉浸體驗</div>
    <div class="track-counter" id="trackCounter">TRACK 1 / 10</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>
<button class="playlist-toggle" id="plToggle">♫ PLAYLIST (10)</button>
<ul class="playlist-panel" id="plPanel"></ul>
<audio id="audioPlayer" preload="auto"></audio>
<script>
const playlist = [{"title": "Impossible Cavern", "src": "audio/Impossible%20Cavern.mp3"}, {"title": "Impossible Cavern 1", "src": "audio/Impossible%20Cavern_1.mp3"}, {"title": "Glacier Valley Drone", "src": "audio/Glacier%20Valley%20Drone.mp3"}, {"title": "Glacier Valley Drone 1", "src": "audio/Glacier%20Valley%20Drone_1.mp3"}, {"title": "Endless Glacier Echo", "src": "audio/Endless%20Glacier%20Echo.mp3"}, {"title": "Endless Glacier Echo 1", "src": "audio/Endless%20Glacier%20Echo_1.mp3"}, {"title": "Frozen Cavern Overture", "src": "audio/Frozen%20Cavern%20Overture.mp3"}, {"title": "Frozen Cavern Overture 1", "src": "audio/Frozen%20Cavern%20Overture_1.mp3"}, {"title": "Glacial Cavern Overture", "src": "audio/Glacial%20Cavern%20Overture.mp3"}, {"title": "Glacial Cavern Overture 1", "src": "audio/Glacial%20Cavern%20Overture_1.mp3"}];
let idx=0, playing=false;
const audio=document.getElementById('audioPlayer'), btn=document.getElementById('playBtn'),
  bg=document.getElementById('bgLayer'), info=document.getElementById('trackInfo'),
  counter=document.getElementById('trackCounter'), fill=document.getElementById('progressFill'),
  panel=document.getElementById('plPanel'), toggle=document.getElementById('plToggle');

function loadTrack(i){
  idx=i;
  audio.src=playlist[i].src;
  info.textContent=playlist[i].title;
  counter.textContent="TRACK " + (i+1) + " / " + playlist.length;
  renderPL();
  if(playing){
    audio.play().catch(e=>console.log('Playback error:',e));
  }
}

function renderPL(){
  panel.innerHTML='';
  playlist.forEach((t,i)=>{
    const li=document.createElement('li');
    li.textContent=(i+1) + ". " + t.title;
    if(i===idx) li.classList.add('active');
    li.onclick=()=>{
      loadTrack(i);
      playing=true;
      audio.play().catch(e=>console.log(e));
      btn.textContent='⏸';
      bg.classList.add('playing');
    };
    panel.appendChild(li);
  });
}

function startPlay() {
  audio.play().then(() => {
    btn.textContent = '⏸';
    bg.classList.add('playing');
    playing = true;
    // Remove listeners once playing successfully
    document.removeEventListener('click', startPlay);
    document.removeEventListener('touchstart', startPlay);
  }).catch(e => {
    console.log('Autoplay waiting for user interaction:', e);
  });
}

btn.onclick=()=>{
  if(playing){
    audio.pause();
    btn.textContent='▶';
    bg.classList.remove('playing');
    playing=false;
  } else {
    audio.play().then(()=>{
      btn.textContent='⏸';
      bg.classList.add('playing');
      playing=true;
    }).catch(e=>console.log(e));
  }
};

document.getElementById('prevBtn').onclick=()=>loadTrack((idx-1+playlist.length)%playlist.length);
document.getElementById('nextBtn').onclick=()=>loadTrack((idx+1)%playlist.length);
audio.onended=()=>loadTrack((idx+1)%playlist.length);
audio.ontimeupdate=()=>{if(audio.duration)fill.style.width=(audio.currentTime/audio.duration*100)+'%'};
toggle.onclick=()=>panel.classList.toggle('open');

// Init load
loadTrack(0);
// Attempt autoplay
playing = true;
startPlay();
// Setup fallback click handlers anywhere on screen
document.addEventListener('click', startPlay);
document.addEventListener('touchstart', startPlay);
</script>
</body>
</html>
