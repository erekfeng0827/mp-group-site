<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品詳情 - 軟構造 Soft Structure</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand" style="flex-direction:row; align-items:center; gap:12px;">
      <svg class="brand-logo" width="42" height="42" viewBox="0 0 120 120">
        <rect x="10" y="10" width="100" height="100" fill="currentColor"/>
        <path d="M10 44 Q60 136 110 44 L110 110 L10 110 Z" fill="var(--brass)"/>
      </svg>
      <div style="display:flex; flex-direction:column;">
        軟構造
        <span class="sub">SOFT STRUCTURE</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html#collections">選品系列</a></li>
      <li><a href="index.html#about">關於我們</a></li>
      <li style="opacity:0.3; margin:0 8px;">|</li>
      <li><a href="../index.html">MINUS PLUS STUDIO</a></li>
      <li><a href="../minusplus/index.html">MINUSPLUS</a></li>
      <li><a href="../corey/index.html">COREY</a></li>
      <li><a href="../aether-vibes/index.html">AETHER VIBES</a></li>
    </ul>
  </div>
</nav>

<main class="product-detail-section" id="productContainer">
  <!-- Content dynamically loaded by JS -->
</main>

<footer class="site-footer">
  <div class="footer-logo">SOFT STRUCTURE</div>
  <div class="footer-copy">© 2026 MINUSPLUS DESIGN. ALL RIGHTS RESERVED.</div>
</footer>

<script src="js/products.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');
  
  const product = getProductById(productId);

  if (!product) {
    document.getElementById('productContainer').innerHTML = '<h2>商品不存在</h2>';
    return;
  }

  // Apply theme class
  document.body.classList.add('theme-' + product.theme);

  const container = document.getElementById('productContainer');
  
  // High-end image placeholder
  const fallbackColor = product.theme === 'khaki' ? '#C2B6A7' : 
                        product.theme === 'red' ? '#4A3335' : 
                        product.theme === 'blue' ? '#2A3845' : '#354538';

  container.innerHTML = `
    <div class="pd-images">
      <img src="assets/images/${product.theme}_room.jpg" alt="${product.name}" class="main-img" style="background:${fallbackColor};">
      <div style="padding: 24px; border: 1px dashed var(--fog-grey); text-align: center; color: var(--fog-grey); font-family: var(--f-label); font-size: 11px; letter-spacing: 0.2em;">
        AI IMAGE GENERATION PENDING
      </div>
    </div>
    <div class="pd-info">
      <div class="label">${SPACES[product.space].label}</div>
      <h1>${product.name}</h1>
      <div class="pd-price">NT$ ${product.price.toLocaleString()}</div>
      <p>${product.desc}</p>
      
      <button class="btn-add" onclick="alert('已加入購物車')">加入購物車 ADD TO CART</button>
      
      <div class="checkout-box">
        <h4>付款方式 PAYMENT</h4>
        <div class="pay-options">
          <label class="pay-opt active">
            <input type="radio" name="payment" value="credit" checked>
            <span>信用卡刷卡 (VISA / MasterCard / JCB)</span>
          </label>
          <label class="pay-opt">
            <input type="radio" name="payment" value="linepay">
            <span style="color:#00C300; font-weight:bold;">LINE Pay</span>
          </label>
          <label class="pay-opt">
            <input type="radio" name="payment" value="transfer">
            <span>銀行轉帳 (Bank Transfer)</span>
          </label>
        </div>
        <p style="font-size: 13px; color: var(--fog-grey); line-height: 1.6;">
          本站採用高規格 SSL 加密傳輸，您的信用卡資訊將被安全保護。若使用 LINE Pay，請在結帳後於手機完成授權。
        </p>
      </div>
    </div>
  `;
});
</script>

</body>
</html>
